name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # oj-common is not published to a Maven repository yet. The job checks this tag out next to the
  # service (the same sibling layout the Dockerfile and judge-deployment use) and installs it.
  oj-common-ref: v0.10.0
  IMAGE: docker.io/thanhtuanle/oj-submission-service

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: oj-submission-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oj-submission-service

      - name: Check out oj-common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: My-Online-Judge/oj-common
          ref: ${{ env.oj-common-ref }}
          path: oj-common

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install oj-common
        run: ./mvnw -B -f ../oj-common/pom.xml install -DskipTests

      - name: Test (Testcontainers enforced)
        # Postgres (and the schema-drift guards) run through Testcontainers. Deactivating their execution condition turns
        # "Docker unavailable on the runner" into a failure instead of a silent skip.
        run: ./mvnw -B verify '-Djunit.jupiter.conditions.deactivate=org.testcontainers.*'

      - name: Build image
        run: >-
          docker build --build-context oj-common=../oj-common
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      - name: Runs as uid 10001
        run: test "$(docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" -u)" = 10001

      - name: Trivy (CRITICAL with a fix fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: oj-submission-service/.trivyignore

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image above (amd64) is the one tested and scanned. What is pushed is built again for amd64 and arm64, so the same tag runs on the
      # server and on an Apple-silicon laptop; the Dockerfile builds the platform-independent part natively, so arm64 is not emulated for it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push the multi-arch image
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --build-context oj-common=../oj-common --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --push -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
