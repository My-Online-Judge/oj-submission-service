server:
  port: 8080

spring:
  application:
    # The remainder of the judge-api monolith, its own service and repo since sub-project 3.
    name: submission-service
  # Serialize any Instant/Date/Calendar JSON in Vietnam time (GMT+7). LocalDateTime fields are naive
  # and unaffected by this — those are pinned via TimeZone.setDefault in SubmissionServiceApplication.main.
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    # Off: with open-in-view the request's EntityManager keeps the JDBC connection it first used until the response
    # is written (for a verdict stream, until the stream ends), so a request that then waits on problem-service,
    # identity or Redis would hold a pooled connection all that time. Every HTTP path reads entities inside a
    # transaction or through an entity graph.
    open-in-view: false
  task:
    scheduling:
      # The outbox relay poll can block 5-15 s while Kafka is down; the queue-depth refresh and the reconcile job
      # must not serialize behind it on the default single thread.
      pool:
        size: 3
  profiles:
    active: @spring.profiles.active@
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # This template publishes a run request (RunService) and a dead letter (KafkaConsumerConfig); the outbox has its
      # own producer with the same bounds (KafkaOutboxSender). Kafka's defaults (60 s metadata wait, 120 s delivery)
      # would hold a Run's Tomcat thread for a minute and answer 504 instead of a prompt 500 while Kafka is away
      # (Run code design §7: a run that cannot be published fails at once). A dead letter that fails is delivered and
      # recovered again, as before.
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: judge-api-results
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "vn.thanhtuanle.messaging.event"
        spring.json.value.default.type: "vn.thanhtuanle.messaging.event.SubmissionJudgedEvent"
  grpc:
    client:
      channels:
        # problem-service's internal API (GetJudgeSpec, GetSampleTestCases); oj-net only, plaintext unless the tls
        # profile is on (application-tls.yml).
        problem-service:
          address: ${PROBLEM_GRPC_ADDRESS:static://localhost:9090}
          negotiation-type: plaintext
          # One problem-service: round_robin gains nothing, and pick_first stays in TRANSIENT_FAILURE while it
          # reconnects, so a call fails at once instead of waiting in the channel (sub-project 8 G1).
          default-load-balancing-policy: pick_first
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Local Redis answers in well under a millisecond. Without these, a Redis that stops answering
      # holds each call (rate limiters, logout blocklist, the after-commit revocation write) for
      # Lettuce's 60 s default before the caller's fallback runs. The command timeout also bounds
      # the connection handshake.
      timeout: 1s
      connect-timeout: 1s
      # We use Redis only for pub/sub fan-out, not Spring Data Redis repositories.
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, NOT '*'. Exposing every endpoint let any authenticated user —
        # including an ordinary contestant, since SecurityConfig gates non-scrape actuator
        # endpoints only with .anyRequest().authenticated() — reach /actuator/heapdump and
        # extract the JWT RSA private key from the dump. Only these four are needed: prometheus
        # (scrape), metrics + health (ops), info. Everything else (env, beans, configprops,
        # loggers, heapdump, threaddump, …) is now unmapped → 404 for everyone, admins included.
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    # Defense in depth: even if the allowlist above is ever widened again, the two endpoints
    # that leak the most (a full heap dump / every thread's stack) stay off. 'access: none' is
    # the Spring Boot 3.4 replacement for the deprecated per-endpoint 'enabled' flag.
    heapdump:
      access: none
    threaddump:
      access: none

logging:
  level:
    root: INFO
    web: INFO
  pattern:
    # trace_id is put in the MDC by the OpenTelemetry Java agent; it links a log line to its trace in Jaeger.
    correlation: "[%X{trace_id:-}] [%X{submissionId:-}] "

judge:
  server:
    token: default_token
  # Reconcile job (SubmissionReconcileJob): a JUDGING submission whose worker started longer ago than this is failed
  # with SYSTEM_ERROR ("Judging timed out")...
  judging-timeout: ${JUDGE_JUDGING_TIMEOUT:3m}
  # ...and a PENDING one whose judge request left the outbox longer ago than this ("Judging request lost").
  pending-timeout: ${JUDGE_PENDING_TIMEOUT:30m}
  reconcile-interval-ms: ${JUDGE_RECONCILE_INTERVAL_MS:60000}
  # OjMetrics recounts PENDING + JUDGING this often (the oj.queue.depth gauge); a scrape never queries the database.
  queue-depth-refresh-ms: 5000
  # SubmissionAdmission refuses a submit (or a rejudge) with 503 QUEUE_FULL, Retry-After 30, once this many are queued.
  max-queue-depth: ${JUDGE_MAX_QUEUE_DEPTH:500}

oj:
  identity:
    base-url: ${OJ_IDENTITY_URI:http://identity-service:8000}
  security:
    jwt:
      # identity-service issues the access tokens and publishes their public key; fetched lazily, on
      # the first request that carries a token.
      jwks-uri: ${OJ_JWKS_URI:http://identity-service:8000/.well-known/jwks.json}
  problems:
    # Optional: the tls profile authenticates this service by its certificate. When set, shared with problem-service
    # (its oj.rpc.token) and sent as x-oj-service-token on every call.
    rpc-token: ${PROBLEM_RPC_TOKEN:}
    # Per attempt; UNAVAILABLE is retried twice (ProblemServiceResilience).
    deadline: 2s
    # A connect gives up after this (ProblemServiceClientConfig): a stopped problem-service fails a call at once.
    connect-timeout: 500ms
  submission:
    cooldown-seconds: ${SUBMISSION_COOLDOWN_SECONDS:10}
  # The Run lane (docs/superpowers/specs/2026-10-24-run-code-design.md §5, §6): POST /submissions/run.
  run:
    max-cases: 6
    max-case-bytes: 65536
    max-event-bytes: 900000
    cooldown-seconds: ${RUN_COOLDOWN_SECONDS:3}
    # Runs this instance keeps waiting at once; a run-worker replica judges one run at a time, so keep this around
    # replicas × 10 (two replicas by default).
    max-inflight: ${RUN_MAX_INFLIGHT:20}
    # From publish to the worker's reply, then 504 RUN_TIMED_OUT. Just above the worst case the worker allows (30 s
    # judge timeout; a checker's first compile on a sandbox adds up to 20 s and may exceed it).
    timeout: ${RUN_TIMEOUT:45s}
  outbox:
    # Rows are normally sent right after their commit; this poll only retries what that dispatch could not send.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:10000}
    batch-size: 100
    retention-days: 7
