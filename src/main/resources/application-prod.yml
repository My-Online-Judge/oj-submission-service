spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
server:
  port: 8000

management:
  server:
    # Actuator (health, prometheus) on its own port, like the other services: Prometheus scrapes it inside
    # oj-net; 8000 serves only the API and the sandboxes' heartbeat. The test profile keeps it on the main port.
    port: 8081

judge:
  server:
    token: ${JUDGE_SERVER_TOKEN}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    vn.thanhtuanle: INFO
  file:
    name: log/app.log
