name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # oj-common is not published to a Maven repository yet. The job checks this tag out next to the
  # service (the same sibling layout the Dockerfile and judge-deployment use) and installs it.
  oj-common-ref: v0.3.0

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oj-submission-service
    steps:
      - uses: actions/checkout@v4
        with:
          path: oj-submission-service

      - name: Check out oj-common
        uses: actions/checkout@v4
        with:
          repository: My-Online-Judge/oj-common
          ref: ${{ env.oj-common-ref }}
          path: oj-common

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install oj-common
        run: ./mvnw -B -f ../oj-common/pom.xml install -DskipTests

      - name: Test
        # Postgres (and the schema-drift guards) run through Testcontainers. Deactivating their execution condition turns
        # "Docker unavailable on the runner" into a failure instead of a silent skip.
        run: ./mvnw -B verify '-Djunit.jupiter.conditions.deactivate=org.testcontainers.*'

      - name: Build image
        run: docker build --build-context oj-common=../oj-common -t submission-service:ci .
